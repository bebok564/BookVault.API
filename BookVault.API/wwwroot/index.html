<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookVault — Library Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#08090c', bg2: '#0e1015', bg3: '#14161d',
          surface: '#1a1d27', surface2: '#21242f',
          line: '#282c3a', line2: '#3a3f52',
          text: '#c4c8d4', dim: '#6a6f82', bright: '#eaedf5',
          accent: '#c9a87c', accent2: '#dfc49e',
          red: '#e25c5c', green: '#5cb878', blue: '#5c8ee2'
        },
        fontFamily: {
          serif: ['"Cormorant Garamond"', 'serif'],
          sans: ['Manrope', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace']
        }
      }
    }
  }
</script>

<!-- Animacje / drobiazgi, których nie da się wyrazić utility-klasami -->
<style>
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes spin { to { transform: rotate(360deg) } }
  ::selection { background: #c9a87c; color: #08090c; }
</style>

<!-- System komponentów zbudowany na Tailwindzie (@apply) -->
<style type="text/tailwindcss">
  @layer base {
    body { @apply bg-bg text-text font-sans min-h-screen leading-relaxed; }
    table { @apply w-full border-collapse; }
    th { @apply text-left px-4 py-3 text-[.7rem] uppercase text-dim border-b border-line bg-bg3 font-semibold; letter-spacing: 1.5px; }
    td { @apply px-4 py-3 text-[.88rem] align-middle; border-bottom: 1px solid rgba(40,44,58,.5); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.015); }
  }

  @layer components {
    /* Layout */
    .app { @apply grid min-h-screen grid-cols-[240px_1fr] max-[900px]:grid-cols-[1fr]; }
    .sidebar { @apply bg-bg2 border-r border-line py-8 sticky top-0 h-screen overflow-y-auto max-[900px]:hidden; }
    .logo { @apply px-6 mb-10; }
    .logo h1 { @apply font-serif text-[1.6rem] font-bold text-bright; letter-spacing: -.5px; }
    .logo h1 span { @apply text-accent; }
    .logo p { @apply text-[.7rem] text-dim uppercase mt-[.15rem]; letter-spacing: 2px; }
    .nav-section { @apply mb-6; }
    .nav-label { @apply text-[.65rem] uppercase text-dim px-6 mb-2; letter-spacing: 2.5px; }
    .nav-item { @apply flex items-center gap-[.65rem] px-6 py-[.6rem] cursor-pointer transition-all text-[.88rem] text-dim border-l-2 border-transparent; }
    .nav-item:hover { @apply text-text; background: rgba(255,255,255,.02); }
    .nav-item.active { @apply text-accent border-l-accent; background: rgba(201,168,124,.08); }
    .nav-icon { @apply text-base w-5 text-center; }
    .nav-count { @apply ml-auto font-mono text-[.7rem] bg-surface px-[.45rem] py-[.1rem] rounded-[3px] text-dim; }

    /* Main + header */
    .main { @apply px-10 py-8 max-w-[1100px] max-[900px]:px-4 max-[900px]:py-5; }
    .page-header { @apply flex justify-between items-center mb-8 flex-wrap gap-4; }
    .page-title { @apply font-serif text-[2.2rem] font-bold text-bright; }
    .page-title span { @apply text-accent; }

    /* Buttons */
    .btn { @apply font-sans px-[1.2rem] py-[.55rem] rounded-md border border-line bg-surface text-text cursor-pointer text-[.82rem] font-semibold transition-all inline-flex items-center gap-[.4rem]; }
    .btn:hover { @apply border-line2 bg-surface2; }
    .btn:disabled { @apply opacity-40 cursor-not-allowed; }
    .btn-accent { @apply bg-accent text-bg border-accent; }
    .btn-accent:hover { @apply bg-accent2 border-accent2; }
    .btn-danger { @apply text-red; border-color: rgba(226,92,92,.25); }
    .btn-danger:hover { @apply border-red; background: rgba(226,92,92,.08); }
    .btn-sm { @apply px-3 py-[.35rem] text-[.75rem]; }

    /* Search */
    .search-bar { @apply flex gap-3 mb-6 flex-wrap; }
    .search-input { @apply flex-1 min-w-[200px] px-4 py-[.6rem] bg-surface border border-line rounded-md text-text font-sans text-[.85rem] outline-none transition-colors; }
    .search-input:focus { @apply border-accent; }
    .search-input::placeholder { @apply text-dim; }
    select.search-input { @apply cursor-pointer max-w-[200px]; }

    /* Table */
    .table-wrap { @apply bg-surface border border-line rounded-[10px] overflow-hidden mb-6; }
    .rating { @apply font-mono text-accent font-semibold; }
    .cat-tag { @apply inline-block text-[.7rem] px-2 py-[.15rem] rounded-[3px] text-accent mr-1 mb-[.2rem]; background: rgba(201,168,124,.08); border: 1px solid rgba(201,168,124,.2); }
    .actions { @apply flex gap-[.35rem]; }
    .empty-state { @apply text-center p-12 text-dim text-[.9rem]; }

    /* Pagination */
    .pagination { @apply flex justify-between items-center mb-8 text-[.82rem] text-dim; }
    .page-info { @apply font-mono text-[.78rem]; }
    .page-btns { @apply flex gap-[.35rem]; }

    /* Modal */
    .modal-overlay { @apply fixed inset-0 z-[100] hidden items-center justify-center p-4; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); }
    .modal-overlay.open { @apply flex; }
    .modal { @apply bg-bg2 border border-line rounded-xl w-full max-w-[520px] max-h-[90vh] overflow-y-auto; animation: modalIn .25s ease; }
    .modal-header { @apply flex justify-between items-center px-6 py-5 border-b border-line; }
    .modal-header h2 { @apply font-serif text-[1.4rem] text-bright; }
    .modal-close { @apply bg-transparent border-none text-dim cursor-pointer text-[1.2rem] p-1 transition-colors; }
    .modal-close:hover { @apply text-text; }
    .modal-body { @apply p-6; }
    .modal-footer { @apply px-6 py-4 border-t border-line flex justify-end gap-2; }

    /* Form */
    .form-group { @apply mb-4; }
    .form-label { @apply block text-[.78rem] font-semibold text-dim mb-[.35rem] uppercase; letter-spacing: .5px; }
    .form-input { @apply w-full px-[.85rem] py-[.55rem] bg-surface border border-line rounded-md text-text font-sans text-[.85rem] outline-none transition-colors; }
    .form-input:focus { @apply border-accent; }
    textarea.form-input { @apply resize-y min-h-[80px]; }
    .form-row { @apply grid grid-cols-2 gap-3; }

    /* Detail panel */
    .detail-panel { @apply bg-surface border border-line rounded-[10px] p-7 mb-6 hidden; }
    .detail-panel.open { @apply block; animation: modalIn .3s ease; }
    .detail-title { @apply font-serif text-[1.8rem] text-bright mb-1; }
    .detail-author { @apply text-accent text-[.95rem] mb-4; }
    .detail-meta { @apply flex gap-6 flex-wrap mb-4 text-[.85rem] text-dim; }
    .detail-meta span { @apply flex items-center gap-[.3rem]; }
    .detail-desc { @apply text-[.9rem] leading-[1.8] mb-6 text-text; }
    .detail-section-title { @apply text-[.72rem] uppercase text-dim mb-3 pb-[.35rem] border-b border-line; letter-spacing: 2px; }

    /* Reviews */
    .review-card { @apply bg-bg3 border border-line rounded-lg px-5 py-4 mb-[.6rem]; }
    .review-top { @apply flex justify-between items-center mb-[.35rem]; }
    .review-name { @apply font-semibold text-bright text-[.88rem]; }
    .review-date { @apply text-[.75rem] text-dim font-mono; }
    .review-stars { @apply text-accent text-[.9rem] mb-[.35rem]; }
    .review-comment { @apply text-[.85rem] text-text; }

    /* Toast */
    .toast { @apply fixed bottom-8 right-8 px-5 py-3 rounded-lg text-[.85rem] font-medium z-[200] hidden; animation: toastIn .3s ease; }
    .toast.show { @apply block; }
    .toast.success { @apply bg-green text-white; }
    .toast.error { @apply bg-red text-white; }

    /* Loading */
    .loading { @apply text-center p-8 text-dim; }
    .spinner { @apply inline-block w-5 h-5 rounded-full mr-2 align-middle; border: 2px solid #282c3a; border-top-color: #c9a87c; animation: spin .6s linear infinite; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <h1>Book<span>Vault</span></h1>
      <p>Library Manager</p>
    </div>
    <div class="nav-section">
      <div class="nav-label">Zarządzanie</div>
      <a class="nav-item" data-nav="books" href="#/books">
        <span class="nav-icon">
          <!-- heroicons: book-open (outline) -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
          </svg>
        </span>Książki<span class="nav-count" id="booksCount">0</span>
      </a>
      <a class="nav-item" data-nav="authors" href="#/authors">
        <span class="nav-icon">
          <!-- heroicons: users (outline) -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
          </svg>
        </span>Autorzy<span class="nav-count" id="authorsCount">0</span>
      </a>
      <a class="nav-item" data-nav="categories" href="#/categories">
        <span class="nav-icon">
          <!-- heroicons: tag (outline) -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z" />
          </svg>
        </span>Kategorie<span class="nav-count" id="categoriesCount">0</span>
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <!-- BOOKS PAGE -->
    <div id="page-books">
      <div class="page-header">
        <h1 class="page-title">Książki</h1>
        <button class="btn btn-accent" onclick="openBookModal()">+ Dodaj książkę</button>
      </div>
      <div class="search-bar">
        <input type="text" class="search-input" id="bookSearch" placeholder="Szukaj po tytule lub autorze..." oninput="searchBooks()">
        <select class="search-input" id="categoryFilter" onchange="searchBooks()">
          <option value="">Wszystkie kategorie</option>
        </select>
        <select class="search-input" id="sortBy" onchange="searchBooks()">
          <option value="title">Sortuj: Tytuł</option>
          <option value="rating">Sortuj: Ocena</option>
          <option value="date">Sortuj: Data</option>
          <option value="author">Sortuj: Autor</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tytuł</th>
              <th>Autor</th>
              <th>Kategorie</th>
              <th>Ocena</th>
              <th>Strony</th>
              <th>Akcje</th>
            </tr>
          </thead>
          <tbody id="booksTable"></tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="page-info" id="pageInfo"></span>
        <div class="page-btns">
          <button class="btn btn-sm" id="prevBtn" onclick="changePage(-1)">← Poprzednia</button>
          <button class="btn btn-sm" id="nextBtn" onclick="changePage(1)">Następna →</button>
        </div>
      </div>
    </div>

    <!-- AUTHORS PAGE -->
    <div id="page-authors" style="display:none">
      <div class="page-header">
        <h1 class="page-title">Autorzy</h1>
        <button class="btn btn-accent" onclick="openAuthorModal()">+ Dodaj autora</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Imię</th><th>Nazwisko</th><th>Bio</th><th>Akcje</th></tr></thead>
          <tbody id="authorsTable"></tbody>
        </table>
      </div>
    </div>

    <!-- CATEGORIES PAGE -->
    <div id="page-categories" style="display:none">
      <div class="page-header">
        <h1 class="page-title">Kategorie</h1>
        <button class="btn btn-accent" onclick="openCategoryModal()">+ Dodaj kategorię</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Nazwa</th><th>Książki</th><th>Akcje</th></tr></thead>
          <tbody id="categoriesTable"></tbody>
        </table>
      </div>
    </div>

    <!-- AUTHOR DETAIL PAGE -->
    <div id="page-author" style="display:none"><div id="authorDetail"></div></div>

    <!-- CATEGORY DETAIL PAGE -->
    <div id="page-category" style="display:none"><div id="categoryDetailView"></div></div>

    <!-- BOOK DETAIL PAGE -->
    <div id="page-book" style="display:none"><div id="bookDetailView"></div></div>

</div>

<!-- Book Modal -->

        <div class="form-group">

          <input type="number" class="form-input" id="bookPages" placeholder="288">
        </div>
      </div>
      <div class="form-group">

<!-- Author Modal -->

  <div class="modal">

        <div class="form-group">

        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea class="form-input" id="authorBio" placeholder="Krótka biografia..."></textarea>

<!-- Category Modal -->

<!-- Review Modal -->

    </div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:5161/api';
let currentPage = 1;
const pageSize = 8;
let allCategories = [];
let allAuthors = [];

// ══════════════════════════════════════
// ROUTER (nawigacja po URL: #/books, #/authors/1, #/categories/3, #/books/5)
// ══════════════════════════════════════
function showView(name) {
  document.querySelectorAll('main > [id^="page-"]').forEach(p => p.style.display = 'none');
  const el = document.getElementById('page-' + name);
  if (el) el.style.display = 'block';
}

function setActiveNav(section) {
  document.querySelectorAll('.nav-item').forEach(n =>
    n.classList.toggle('active', n.dataset.nav === section));
}

// Nawigacja programistyczna; jeśli hash się nie zmienia, wymuś ponowne wyrenderowanie
function go(hash) { if (location.hash === hash) router(); else location.hash = hash; }
function refresh() { router(); }

async function router() {
  const raw = (location.hash || '#/books').replace(/^#\/?/, '');
  const [section, id] = raw.split('/');
  window.scrollTo(0, 0);

  if (section === 'authors' && id) { setActiveNav('authors'); showView('author'); await loadAuthorDetail(id); }
  else if (section === 'authors') { setActiveNav('authors'); showView('authors'); await loadAuthors(); }
  else if (section === 'categories' && id) { setActiveNav('categories'); showView('category'); await loadCategoryDetail(id); }
  else if (section === 'categories') { setActiveNav('categories'); showView('categories'); await loadCategories(); }
  else if (section === 'books' && id) { setActiveNav('books'); showView('book'); await loadBookDetail(id); }
  else { setActiveNav('books'); showView('books'); await loadBooks(); }
}

// ── Helpery linków ──
function esc(s) { return String(s).replace(/'/g, "\\'"); }
function catTag(name) {
  const cat = allCategories.find(c => c.name === name);
  return cat
    ? `<a class="cat-tag" href="#/categories/${cat.id}">${name}</a>`
    : `<span class="cat-tag">${name}</span>`;
}
function authorLink(name) {
  const a = allAuthors.find(a => `${a.firstName} ${a.lastName}` === name);
  return a ? `<a href="#/authors/${a.id}" class="hover:text-accent">${name}</a>` : name;
}

// ══════════════════════════════════════
// API HELPERS
// ══════════════════════════════════════
async function api(path, options = {}) {
  try {
    const res = await fetch(`${API}${path}`, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (res.status === 204) return null;
    if (!res.ok) {
      const body = await res.json().catch(() => null);
      // API zwraca błędy albo jako string (Conflict/BadRequest("...")), albo jako ProblemDetails
      const msg = typeof body === 'string'
        ? body
        : (body?.error || body?.title || body?.detail || `Error ${res.status}`);
      throw new Error(msg);
    }
    return await res.json();
  } catch (e) {
    if (e.message.includes('Failed to fetch')) {
      showToast('Nie można połączyć z API — upewnij się że serwer działa', 'error');
    } else {
      showToast(e.message, 'error');
    }
    throw e;
  }
}

// ══════════════════════════════════════
// BOOKS
// ══════════════════════════════════════
async function loadBooks() {
  const search = document.getElementById('bookSearch').value;
  const catId = document.getElementById('categoryFilter').value;
  const sort = document.getElementById('sortBy').value;
  let query = `?page=${currentPage}&pageSize=${pageSize}&sortBy=${sort}`;
  if (search) query += `&search=${encodeURIComponent(search)}`;
  if (catId) query += `&categoryId=${catId}`;

  try {
    const data = await api(`/books${query}`);
    const tbody = document.getElementById('booksTable');
    document.getElementById('booksCount').textContent = data.totalCount;

    if (!data.items.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state">Brak książek do wyświetlenia</div></td></tr>';
    } else {
      tbody.innerHTML = data.items.map(b => `
        <tr>
          <td><a href="#/books/${b.id}" class="text-bright font-semibold hover:text-accent">${b.title}</a></td>
          <td>${authorLink(b.authorName)}</td>
          <td>${b.categories.map(catTag).join('')}</td>
          <td><span class="rating">${b.averageRating > 0 ? '★ ' + b.averageRating.toFixed(1) : '—'}</span></td>
          <td>${b.pageCount}</td>
          <td class="actions">
            <button class="btn btn-sm" onclick="editBook(${b.id})">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="deleteBook(${b.id}, '${esc(b.title)}')">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('pageInfo').textContent = `Strona ${data.page} z ${data.totalPages || 1}`;
    document.getElementById('prevBtn').disabled = !data.hasPrevious;
    document.getElementById('nextBtn').disabled = !data.hasNext;
  } catch (e) {}
}

function searchBooks() {
  currentPage = 1;
  loadBooks();
}

function changePage(dir) {
  currentPage += dir;
  loadBooks();
}

function openBookModal(book = null) {
  document.getElementById('bookModalTitle').textContent = book ? 'Edytuj książkę' : 'Dodaj książkę';
  document.getElementById('bookId').value = book ? book.id : '';
  document.getElementById('bookTitle').value = book ? book.title : '';
  document.getElementById('bookIsbn').value = book ? book.isbn : '';
  document.getElementById('bookPages').value = book ? book.pageCount : '';
  document.getElementById('bookDesc').value = book ? (book.description || '') : '';
  document.getElementById('bookDate').value = book ? book.publishedDate : '';

  // Populate authors dropdown
  const authorSel = document.getElementById('bookAuthor');
  authorSel.innerHTML = allAuthors.map(a => `<option value="${a.id}" ${book && book.authorId === a.id ? 'selected' : ''}>${a.firstName} ${a.lastName}</option>`).join('');

  // Populate category checkboxes
  const catDiv = document.getElementById('bookCategoriesCheckboxes');
  const selectedCats = book ? (book.categoryIds || []) : [];
  catDiv.innerHTML = allCategories.map(c => `
    <label style="display:flex;align-items:center;gap:.3rem;font-size:.82rem;cursor:pointer;padding:.3rem .6rem;background:#1a1d27;border:1px solid #282c3a;border-radius:4px">
      <input type="checkbox" value="${c.id}" ${selectedCats.includes(c.id) ? 'checked' : ''}> ${c.name}
    </label>
  `).join('');

  openModal('bookModal');
}

async function editBook(id) {
  try {
    const book = await api(`/books/${id}`);
    // Map to editable format
    const catIds = [];
    for (const catName of book.categories) {
      const found = allCategories.find(c => c.name === catName);
      if (found) catIds.push(found.id);
    }
    openBookModal({
      id: book.id,
      title: book.title,
      isbn: book.isbn,
      pageCount: book.pageCount,
      description: book.description,
      publishedDate: book.publishedDate,
      authorId: book.author.id,
      categoryIds: catIds
    });
  } catch (e) {}
}

async function saveBook() {
  const id = document.getElementById('bookId').value;
  const catCheckboxes = document.querySelectorAll('#bookCategoriesCheckboxes input:checked');
  const body = {
    title: document.getElementById('bookTitle').value,
    isbn: document.getElementById('bookIsbn').value,
    description: document.getElementById('bookDesc').value || null,
    pageCount: parseInt(document.getElementById('bookPages').value) || 0,
    publishedDate: document.getElementById('bookDate').value,
    authorId: parseInt(document.getElementById('bookAuthor').value),
    categoryIds: Array.from(catCheckboxes).map(cb => parseInt(cb.value))
  };

  try {
    if (id) {
      await api(`/books/${id}`, { method: 'PUT', body: JSON.stringify(body) });
      showToast('Książka zaktualizowana');
    } else {
      await api('/books', { method: 'POST', body: JSON.stringify(body) });
      showToast('Książka dodana');
    }
    closeModal('bookModal');
    refresh();
  } catch (e) {}
}

async function deleteBook(id, title) {
  if (!confirm(`Czy na pewno chcesz usunąć "${title}"?`)) return;
  try {
    await api(`/books/${id}`, { method: 'DELETE' });
    showToast('Książka usunięta');
    // jeśli jesteśmy na stronie szczegółów tej książki — wróć na listę
    if (location.hash.startsWith('#/books/')) go('#/books'); else refresh();
  } catch (e) {}
}

async function deleteAuthor(id, name) {

// ══════════════════════════════════════
// CATEGORIES
// ══════════════════════════════════════
async function loadCategories() {
  try {
    const data = await api('/categories');
    allCategories = data;
    document.getElementById('categoriesCount').textContent = data.length;

    // Update filter dropdown
    const filter = document.getElementById('categoryFilter');
    const currentVal = filter.value;
    filter.innerHTML = '<option value="">Wszystkie kategorie</option>' +
      data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    filter.value = currentVal;

    const tbody = document.getElementById('categoriesTable');
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="3"><div class="empty-state">Brak kategorii</div></td></tr>';
    } else {
      tbody.innerHTML = data.map(c => `
        <tr>
          <td><a class="cat-tag" style="font-size:.82rem" href="#/categories/${c.id}">${c.name}</a></td>
          <td><a class="btn btn-sm" href="#/categories/${c.id}">📚 Pokaż książki</a></td>
          <td class="actions">
            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.id}, '${esc(c.name)}')">🗑️</button>
          </td>
        </tr>
      `).join('');
    }
  } catch (e) {}
}

  try {
    const books = await api(`/categories/${id}/books`);
    const cat = allCategories.find(c => String(c.id) === String(id));
    const c = document.getElementById('categoryDetailView');
    c.innerHTML = `
      <div class="page-header">

            <table>
              <thead><tr><th>Tytuł</th><th>Autor</th><th>Ocena</th><th>Strony</th></tr></thead>
              <tbody>
                ${books.map(b => `
                  <tr>
                    <td><a href="#/books/${b.id}" class="text-bright font-semibold hover:text-accent">${b.title}</a></td>
                    <td>${authorLink(b.authorName)}</td>
                    <td><span class="rating">${b.averageRating > 0 ? '★ ' + b.averageRating.toFixed(1) : '—'}</span></td>

          </div>

      </div>
    `;
  } catch (e) {}
}

function openCategoryModal() {
  document.getElementById('categoryName').value = '';
  openModal('categoryModal');
}

async function saveCategory() {
  const body = { name: document.getElementById('categoryName').value };
  try {
    await api('/categories', { method: 'POST', body: JSON.stringify(body) });
    showToast('Kategoria dodana');
    closeModal('categoryModal');
    await loadCategories();
    refresh();
  } catch (e) {}
}

async function deleteCategory(id, name) {
  if (!confirm(`Czy na pewno chcesz usunąć kategorię "${name}"?`)) return;
  try {
    await api(`/categories/${id}`, { method: 'DELETE' });
    showToast('Kategoria usunięta');
    await loadCategories();
    // jeśli jesteśmy na stronie tej kategorii — wróć na listę
    if (location.hash.startsWith('#/categories/')) go('#/categories'); else refresh();
  } catch (e) {}
}

// ══════════════════════════════════════
// REVIEWS
// ══════════════════════════════════════
function openReviewModal(bookId) {
  document.getElementById('reviewBookId').value = bookId;
  document.getElementById('reviewName').value = '';
  document.getElementById('reviewComment').value = '';
  document.getElementById('reviewRating').value = 0;
  pickRating(0);
  openModal('reviewModal');
}

function pickRating(n) {
  document.getElementById('reviewRating').value = n;
  const stars = document.getElementById('starPicker').children;
  for (let i = 0; i < 5; i++) {
    stars[i].textContent = i < n ? '★' : '☆';
    stars[i].style.color = i < n ? '#c9a87c' : '#6a6f82';
  }
}

async function saveReview() {
  const bookId = document.getElementById('reviewBookId').value;
  const body = {
    reviewerName: document.getElementById('reviewName').value,
    rating: parseInt(document.getElementById('reviewRating').value),
    comment: document.getElementById('reviewComment').value || null
  };

  try {
    await api(`/books/${bookId}/reviews`, { method: 'POST', body: JSON.stringify(body) });
    showToast('Recenzja dodana');
    closeModal('reviewModal');
    refresh();
  } catch (e) {}
}

// ══════════════════════════════════════
// MODAL HELPERS
// ══════════════════════════════════════
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// Close on backdrop click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// Close on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
  }
});

// ══════════════════════════════════════
// TOAST
// ══════════════════════════════════════
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
async function init() {
  try {
    // Dane współdzielone (potrzebne do linków, filtrów i formularzy) ładujemy raz na starcie
    await loadCategories();
    await loadAuthors();
  } catch (e) {
    console.error('Init failed:', e);
  }
  window.addEventListener('hashchange', router);
  router();  // wyrenderuj widok wg bieżącego adresu (#/...)
}

init();
</script>
